name: TradeFlow NG — Daily Pipeline

on:
  schedule:
    # 06:00 WAT = 05:00 UTC every day
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (all / kobo / cleaning / forecasting / optimization)"
        required: false
        default: "all"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      JWT_SECRET:        ${{ secrets.JWT_SECRET }}
      KOBO_API_TOKEN:    ${{ secrets.KOBO_API_TOKEN }}
      KOBO_ASSET_UID:    ${{ secrets.KOBO_ASSET_UID }}
      ADMIN_USERNAME:    ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD:    ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


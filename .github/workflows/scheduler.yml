name: TradeFlow NG — Daily Pipeline

on:
  # Runs every day at 05:00 UTC = 06:00 WAT (Lagos time)
  schedule:
    - cron: "0 5 * * *"

  # Also allows manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - kobo-only
          - forecast-only
          - optimize-only
          - accuracy

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the pipeline
      # DATABASE_URL and KOBO_API_TOKEN come from GitHub repository secrets.
      # To set them: GitHub repo → Settings → Secrets and variables →
      # Actions → New repository secret
      - name: Run TradeFlow NG pipeline
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          KOBO_API_TOKEN:  ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID:  ${{ secrets.KOBO_ASSET_UID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "full" ]; then
            python src/scheduler.py
          elif [ "$MODE" = "kobo-only" ]; then
            python src/scheduler.py --kobo-only
          elif [ "$MODE" = "forecast-only" ]; then
            python src/scheduler.py --forecast-only
          elif [ "$MODE" = "optimize-only" ]; then
            python src/scheduler.py --optimize-only
          elif [ "$MODE" = "accuracy" ]; then
            python src/scheduler.py --accuracy
          fi

      # 5. Notify on failure (optional — remove if not needed)
      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed on $(date). Check Actions logs."
